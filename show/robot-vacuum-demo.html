<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇청소기 청소</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .page.active {
            display: flex;
        }

        /* 첫 번째 페이지 - 선택 화면 */
        .page-1 {
            background-image: url('bg.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-1-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        .button-container {
            position: absolute;
            bottom: 60%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .cleaning-button {
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            padding: 0;
        }

        .cleaning-button:hover {
            transform: scale(1.05);
        }

        .cleaning-button:active {
            transform: scale(0.98);
        }

        .cleaning-button img {
            display: block;
            width: 400px;
            height: auto;
        }

        /* 두 번째 페이지 - 청소 진행 중 */
        .page-2 {
            background-image: url('bg_ing.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-2-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vacuum-cleaning {
            position: absolute;
            bottom: 25%;
            left: 15%;
            animation: moveVacuum 3s ease-in-out infinite;
        }

        .vacuum-cleaning img {
            width: 300px;
            height: auto;
        }

        @keyframes moveVacuum {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            25% {
                transform: translateX(150px) translateY(-40px);
            }

            50% {
                transform: translateX(300px) translateY(0);
            }

            75% {
                transform: translateX(150px) translateY(40px);
            }
        }

        /* 세 번째 페이지 - 완료 화면 */
        .page-3 {
            background-image: url('bg_end.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-3-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .sparkle {
            position: absolute;
            animation: sparkle 3s ease-in-out infinite;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.3));
        }

        .sparkle img {
            display: block;
            width: 1000px;
            height: auto;
        }

        .sparkle-1 {
            bottom: 10%;
            left: 25%;
            transform: translateX(-50%);
            animation-delay: 0s;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.15) rotate(5deg);
            }
        }

        .end-image {
            position: absolute;
            bottom: 55%;
            left: 35%;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .end-image.show {
            opacity: 1;
            transform: scale(1);
        }

        .end-image img {
            width: 300px;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- 첫 번째 페이지 - 선택 화면 -->
    <div class="page page-1 active" id="page1">
        <div class="page-1-content">
            <div class="button-container">
                <button class="cleaning-button" data-type="dust">
                    <img src="먼지흡입.png" alt="먼지 흡입">
                </button>
                <button class="cleaning-button" data-type="mop">
                    <img src="물걸레청소.png" alt="물걸레 청소">
                </button>
                <button class="cleaning-button" data-type="full">
                    <img src="전체청소.png" alt="전체 청소">
                </button>
            </div>
        </div>
    </div>

    <!-- 두 번째 페이지 - 청소 진행 중 -->
    <div class="page page-2" id="page2">
        <div class="page-2-content">
            <div class="vacuum-cleaning">
                <img src="청소기_ing.png" alt="청소 중인 로봇청소기">
            </div>
        </div>
    </div>

    <!-- 세 번째 페이지 - 완료 화면 -->
    <div class="page page-3" id="page3">
        <div class="page-3-content">
            <div class="end-image">
                <img src="end.png" alt="완료">
            </div>
            <div class="sparkles">
                <div class="sparkle sparkle-1">
                    <img src="kirakira.png" alt="반짝임">
                </div>
            </div>
        </div>
    </div>

    <!-- BGM 오디오 요소 -->
    <audio id="bgmAudio" preload="auto">
        <source src="청소기bgm.mp4" type="audio/mpeg">
    </audio>

    <script>
        const buttons = document.querySelectorAll('.cleaning-button');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');
        const bgmAudio = document.getElementById('bgmAudio');

        // 오디오 볼륨 설정 (0.0 ~ 1.0)
        if (bgmAudio) {
            bgmAudio.volume = 0.7; // 70% 볼륨
            // 오디오 로드 에러 처리
            bgmAudio.addEventListener('error', function (e) {
                console.error('[BGM] 오디오 로드 에러:', bgmAudio.error);
                console.error('[BGM] 오디오 소스:', bgmAudio.src);
            });
        }

        // 오디오 컨텍스트 활성화 플래그
        let audioContextActivated = false;

        // 사용자 상호작용 시 오디오 컨텍스트 활성화
        function activateAudioContext() {
            if (!audioContextActivated && bgmAudio) {
                // 오디오 컨텍스트를 활성화하기 위해 조용히 재생 시도
                const playPromise = bgmAudio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            // 재생 성공 시 즉시 일시정지 (실제 재생은 나중에)
                            bgmAudio.pause();
                            bgmAudio.currentTime = 0;
                            audioContextActivated = true;
                            console.log('[BGM] 오디오 컨텍스트 활성화 완료');
                        })
                        .catch(() => {
                            // 실패해도 무시 (나중에 재시도) - 조용히 처리
                        });
                }
            }
        }

        // 페이지 클릭/터치 시 오디오 컨텍스트 활성화 (한 번만)
        let userInteracted = false;
        function handleUserInteraction() {
            if (!userInteracted) {
                userInteracted = true;
                activateAudioContext();
            }
        }
        document.addEventListener('click', handleUserInteraction, { once: true });
        document.addEventListener('touchstart', handleUserInteraction, { once: true });

        // 청소 버튼 클릭 시에도 활성화
        buttons.forEach(button => {
            button.addEventListener('click', function () {
                activateAudioContext();
            });
        });

        // 전체 청소 버튼 클릭 함수
        function handleFullCleaningButton() {
            const fullCleaningButton = document.querySelector('.cleaning-button[data-type="full"]');
            if (fullCleaningButton) {
                console.log('✅ 전체 청소 버튼 클릭 시뮬레이션');
                // 버튼 클릭 이벤트 트리거
                fullCleaningButton.click();
            } else {
                console.error('❌ 전체 청소 버튼을 찾을 수 없습니다.');
            }
        }

        buttons.forEach(button => {
            button.addEventListener('click', function () {
                const cleaningType = this.getAttribute('data-type');

                // end.png 초기화
                const endImage = document.querySelector('.end-image');
                if (endImage) {
                    endImage.classList.remove('show');
                }

                // BGM 재생 시작 (끝까지 재생)
                // 버튼 클릭은 사용자 상호작용으로 간주되므로 바로 재생 시도
                // 오디오 컨텍스트가 활성화되어 있으면 재생, 아니면 조용히 실패
                if (bgmAudio && audioContextActivated) {
                    // 오디오가 로드되었는지 확인
                    if (bgmAudio.readyState >= 2) { // HAVE_CURRENT_DATA 이상
                        bgmAudio.currentTime = 0;
                        const playPromise = bgmAudio.play();
                        if (playPromise !== undefined) {
                            playPromise
                                .then(() => {
                                    console.log('[BGM] 재생 시작 성공');
                                })
                                .catch(error => {
                                    console.error('[BGM] 재생 실패:', error.name, error.message);
                                });
                        }
                    } else {
                        // 오디오가 아직 로드되지 않았으면 로드 대기
                        bgmAudio.addEventListener('canplaythrough', function onCanPlay() {
                            bgmAudio.removeEventListener('canplaythrough', onCanPlay);
                            bgmAudio.currentTime = 0;
                            bgmAudio.play()
                                .then(() => {
                                    console.log('[BGM] 재생 시작 성공 (로드 후)');
                                })
                                .catch(error => {
                                    console.error('[BGM] 재생 실패 (로드 후):', error.name, error.message);
                                });
                        }, { once: true });
                        // 로드 강제 시작
                        bgmAudio.load();
                    }
                } else if (!audioContextActivated) {
                    // 오디오 컨텍스트가 활성화되지 않았으면 조용히 무시
                    // (사용자가 페이지를 클릭하면 자동으로 활성화됨)
                }

                // 첫 번째 페이지 숨기기
                page1.classList.remove('active');

                // 두 번째 페이지 보이기
                page2.classList.add('active');

                // 4초 후 세 번째 페이지로 이동
                setTimeout(() => {
                    page2.classList.remove('active');
                    page3.classList.add('active');

                    // end.png가 나타나도록
                    setTimeout(() => {
                        if (endImage) {
                            endImage.classList.add('show');
                        }
                    }, 200);

                    // BGM은 끝까지 재생되도록 유지 (자동 정지하지 않음)
                }, 4000);
            });
        });

        // 페이지 전환 시에도 BGM이 계속 재생되도록 유지
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden && !bgmAudio.paused) {
                // 페이지가 다시 보일 때 재생 중이었다면 계속 재생
                bgmAudio.play().catch(error => {
                    console.error('BGM 재생 실패:', error);
                });
            }
        });

        // 원격 시작 명령 폴링 (Flutter 앱에서 시작 명령을 보내면 자동으로 시작)
        // URL 파라미터에서 IP 주소 가져오기 (예: ?ip=192.168.0.47)
        const urlParams = new URLSearchParams(window.location.search);
        const serverIP = urlParams.get('ip') || '192.168.0.47'; // 기본값: 192.168.0.47
        const API_BASE_URL = `http://${serverIP}:8088/api`;
        const POLLING_INTERVAL = 1000; // 1초마다 확인

        console.log('[로봇청소기] 서버 IP:', serverIP);
        console.log('[로봇청소기] API_BASE_URL:', API_BASE_URL);

        function checkRemoteStartCommand() {
            fetch(`${API_BASE_URL}/device/check-robot-vacuum-command`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('[폴링] 응답 데이터:', data);
                    console.log('[폴링] should_start:', data.should_start);
                    if (data.should_start) {
                        console.log('✅ 원격 시작 명령 수신:', data);
                        console.log('✅ handleFullCleaningButton() 호출 시작');
                        handleFullCleaningButton();
                        console.log('✅ handleFullCleaningButton() 호출 완료');
                    }
                })
                .catch(error => {
                    if (!checkRemoteStartCommand.errorLogged) {
                        console.error('❌ 원격 시작 명령 확인 실패:', error);
                        console.error('API_BASE_URL:', API_BASE_URL);
                        checkRemoteStartCommand.errorLogged = true;
                    }
                });
        }
        checkRemoteStartCommand.errorLogged = false; // Reset error log flag

        // 페이지 로드 시 연결 테스트 및 폴링 시작
        (async function () {
            try {
                const testResponse = await fetch(`${API_BASE_URL}/device/test`);
                const testData = await testResponse.json();
                console.log('✅ 서버 연결 성공:', testData);
            } catch (error) {
                console.error('❌ 서버 연결 실패:', error);
                console.error('API_BASE_URL:', API_BASE_URL);
                console.error(`서버가 실행 중인지 확인하세요: http://${serverIP}:8088`);
                console.error('URL 파라미터로 IP를 지정할 수 있습니다: ?ip=192.168.0.XX');
            }
            setInterval(checkRemoteStartCommand, POLLING_INTERVAL);
        })();
    </script>
</body>

</html>
