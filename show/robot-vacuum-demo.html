<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로봇청소기 청소</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        .page {
            position: absolute;
            width: 100%;
            height: 100%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .page.active {
            display: flex;
        }

        /* 첫 번째 페이지 - 선택 화면 */
        .page-1 {
            background-image: url('bg.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-1-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }


        .button-container {
            position: absolute;
            bottom: 60%;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        .cleaning-button {
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            background: none;
            padding: 0;
        }

        .cleaning-button:hover {
            transform: scale(1.05);
        }

        .cleaning-button:active {
            transform: scale(0.98);
        }

        .cleaning-button img {
            display: block;
            width: 400px;
            height: auto;
        }

        /* 두 번째 페이지 - 청소 진행 중 */
        .page-2 {
            background-image: url('bg_ing.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-2-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .vacuum-cleaning {
            position: absolute;
            bottom: 25%;
            left: 15%;
            animation: moveVacuum 3s ease-in-out infinite;
        }

        .vacuum-cleaning img {
            width: 300px;
            height: auto;
        }

        @keyframes moveVacuum {

            0%,
            100% {
                transform: translateX(0) translateY(0);
            }

            25% {
                transform: translateX(150px) translateY(-40px);
            }

            50% {
                transform: translateX(300px) translateY(0);
            }

            75% {
                transform: translateX(150px) translateY(40px);
            }
        }

        /* 세 번째 페이지 - 완료 화면 */
        .page-3 {
            background-image: url('bg_end.png');
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #f5f5f5;
        }

        .page-3-content {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .sparkles {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 10;
        }

        .sparkle {
            position: absolute;
            animation: sparkle 3s ease-in-out infinite;
            z-index: 10;
            filter: drop-shadow(0 2px 4px rgba(255, 255, 255, 0.3));
        }

        .sparkle img {
            display: block;
            width: 1000px;
            height: auto;
        }

        .sparkle-1 {
            bottom: 10%;
            left: 25%;
            transform: translateX(-50%);
            animation-delay: 0s;
        }

        @keyframes sparkle {

            0%,
            100% {
                opacity: 0.7;
                transform: scale(1) rotate(0deg);
            }

            50% {
                opacity: 1;
                transform: scale(1.15) rotate(5deg);
            }
        }

        .end-image {
            position: absolute;
            bottom: 55%;
            left: 35%;
            opacity: 0;
            transform: scale(0.8);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .end-image.show {
            opacity: 1;
            transform: scale(1);
        }

        .end-image img {
            width: 300px;
            height: auto;
        }
    </style>
</head>

<body>
    <!-- 첫 번째 페이지 - 선택 화면 -->
    <div class="page page-1 active" id="page1">
        <div class="page-1-content">
            <div class="button-container">
                <button class="cleaning-button" data-type="dust">
                    <img src="먼지흡입.png" alt="먼지 흡입">
                </button>
                <button class="cleaning-button" data-type="mop">
                    <img src="물걸레청소.png" alt="물걸레 청소">
                </button>
                <button class="cleaning-button" data-type="full">
                    <img src="전체청소.png" alt="전체 청소">
                </button>
            </div>
        </div>
    </div>

    <!-- 두 번째 페이지 - 청소 진행 중 -->
    <div class="page page-2" id="page2">
        <div class="page-2-content">
            <div class="vacuum-cleaning">
                <img src="청소기_ing.png" alt="청소 중인 로봇청소기">
            </div>
        </div>
    </div>

    <!-- 세 번째 페이지 - 완료 화면 -->
    <div class="page page-3" id="page3">
        <div class="page-3-content">
            <div class="end-image">
                <img src="end.png" alt="완료">
            </div>
            <div class="sparkles">
                <div class="sparkle sparkle-1">
                    <img src="kirakira.png" alt="반짝임">
                </div>
            </div>
        </div>
    </div>

    <script>
        const buttons = document.querySelectorAll('.cleaning-button');
        const page1 = document.getElementById('page1');
        const page2 = document.getElementById('page2');
        const page3 = document.getElementById('page3');

        buttons.forEach(button => {
            button.addEventListener('click', function () {
                const cleaningType = this.getAttribute('data-type');

                // end.png 초기화
                const endImage = document.querySelector('.end-image');
                if (endImage) {
                    endImage.classList.remove('show');
                }

                // 첫 번째 페이지 숨기기
                page1.classList.remove('active');

                // 두 번째 페이지 보이기
                page2.classList.add('active');

                // 4초 후 세 번째 페이지로 이동
                setTimeout(() => {
                    page2.classList.remove('active');
                    page3.classList.add('active');

                    // end.png가 나타나도록
                    setTimeout(() => {
                        if (endImage) {
                            endImage.classList.add('show');
                        }
                    }, 200);
                }, 4000);
            });
        });
    </script>
</body>

</html>
