<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>세탁기 시연</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
            background: linear-gradient(135deg, #e0e0e0 0%, #c0c0c0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .washing-machine {
            width: 850px;
            background: linear-gradient(135deg, #f8f8f8 0%, #ffffff 100%);
            border-radius: 25px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.15),
                0 5px 15px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.9);
            overflow: hidden;
            position: relative;
            border: 1px solid #e0e0e0;
        }

        .control-panel {
            background: #ffffff;
            padding: 15px 35px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0;
            border-bottom: 2px solid #e5e5e5;
            min-height: 130px;
            overflow: visible;
            position: relative;
            z-index: 1;
        }

        .power-button,
        .play-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffffff 0%, #f5f5f5 100%);
            border: 2px solid #d5d5d5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 20px;
            color: #333;
            box-shadow:
                0 3px 8px rgba(0, 0, 0, 0.08),
                inset 0 1px 3px rgba(255, 255, 255, 0.9);
            flex-shrink: 0;
            aspect-ratio: 1;
        }

        .power-button {
            order: 1;
            flex-shrink: 0;
            margin-right: 30px;
            margin-left: 120px;
        }

        .play-button {
            order: 3;
            flex-shrink: 0;
            margin-left: 30px;
            margin-right: 30px;
        }

        .power-button:hover,
        .play-button:hover {
            transform: scale(1.05);
            box-shadow:
                0 6px 15px rgba(0, 0, 0, 0.15),
                inset 0 2px 5px rgba(255, 255, 255, 1);
        }

        .power-button:active,
        .play-button:active {
            transform: scale(0.98);
        }

        .main-display {
            flex: 0 0 auto;
            width: 220px;
            height: 220px;
            min-width: 220px;
            min-height: 220px;
            max-width: 220px;
            max-height: 220px;
            border-radius: 50%;
            aspect-ratio: 1;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border: 10px solid #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
            padding: 28px;
            box-shadow:
                inset 0 0 50px rgba(0, 0, 0, 0.9),
                0 15px 40px rgba(0, 0, 0, 0.4),
                0 8px 20px rgba(0, 0, 0, 0.3),
                inset 0 0 0 1px rgba(255, 255, 255, 0.1);
            overflow: hidden;
            order: 2;
            flex-shrink: 0;
            margin-left: 30px;
            margin-right: 30px;
            z-index: 10;
        }

        .status-dots {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
            margin-top: 3px;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #4a9eff;
            box-shadow: 0 0 15px rgba(74, 158, 255, 0.9);
            transform: scale(1.3);
        }

        .main-status {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
            letter-spacing: 2px;
            word-break: keep-all;
            white-space: nowrap;
        }

        .sub-status {
            font-size: 14px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }

        .settings-panel {
            width: auto;
            min-width: auto;
            max-width: none;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            border-radius: 12px;
            padding: 15px 10px;
            display: flex;
            flex-direction: row;
            gap: 20px;
            box-shadow:
                inset 0 0 25px rgba(0, 0, 0, 0.9),
                0 4px 12px rgba(0, 0, 0, 0.25),
                inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            flex-shrink: 0;
            order: 4;
        }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .setting-dots {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            transition: all 0.3s ease;
        }

        .setting-dot.active {
            background: #4a9eff;
            width: 10px;
            height: 10px;
            box-shadow: 0 0 10px rgba(74, 158, 255, 0.7);
        }

        .setting-label {
            font-size: 13px;
            color: #ccc;
        }

        .drum-container {
            background: linear-gradient(135deg, #3a3a3a 0%, #2a2a2a 100%);
            padding: 90px 70px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 650px;
            position: relative;
            box-shadow: inset 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* 세탁기 문 - 더 명확하게 */
        .door-frame {
            position: absolute;
            width: 560px;
            height: 560px;
            border-radius: 50%;
            border: 40px solid #2a2a2a;
            background: #1a1a1a;
            box-shadow:
                inset 0 0 50px rgba(0, 0, 0, 0.9),
                0 15px 40px rgba(0, 0, 0, 0.6);
            z-index: 1;
            pointer-events: none;
        }

        .door-glass {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            border: 15px solid #0a0a0a;
            background:
                radial-gradient(circle at 45% 45%, rgba(150, 200, 255, 0.15) 0%, rgba(100, 150, 200, 0.08) 40%, transparent 70%),
                linear-gradient(135deg, rgba(40, 50, 60, 0.2) 0%, rgba(20, 25, 35, 0.3) 100%);
            backdrop-filter: blur(0.3px);
            box-shadow:
                inset 0 0 100px rgba(0, 0, 0, 0.95),
                inset 0 0 40px rgba(50, 100, 150, 0.15);
            z-index: 2;
            pointer-events: none;
        }

        .door-handle {
            position: absolute;
            right: -8px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 80px;
            background: linear-gradient(135deg, #6a6a6a 0%, #4a4a4a 50%, #3a3a3a 100%);
            border-radius: 8px 0 0 8px;
            box-shadow:
                inset -3px 0 8px rgba(0, 0, 0, 0.5),
                0 2px 6px rgba(0, 0, 0, 0.4),
                inset 0 0 0 1px rgba(0, 0, 0, 0.3);
            z-index: 10;
            pointer-events: none;
        }

        .door-handle::before {
            content: '';
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            width: 3px;
            height: 40px;
            background: linear-gradient(180deg, #8a8a8a 0%, #5a5a5a 50%, #8a8a8a 100%);
            border-radius: 2px;
            box-shadow: inset 0 0 4px rgba(0, 0, 0, 0.3);
        }

        /* 세탁통 - 더 크고 명확하게 */
        .drum {
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background:
                radial-gradient(circle at 35% 35%, rgba(255, 255, 255, 0.2) 0%, transparent 60%),
                linear-gradient(135deg, #5a5a5a 0%, #4a4a4a 30%, #3a3a3a 70%, #2a2a2a 100%);
            border: 18px solid #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow:
                inset 0 0 80px rgba(0, 0, 0, 0.9),
                0 0 50px rgba(0, 0, 0, 0.7),
                inset 0 0 150px rgba(0, 0, 0, 0.5);
            z-index: 3;
        }

        /* 세탁통에 세로 줄무늬 추가 - 회전이 더 잘 보이도록 */
        .drum::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: repeating-linear-gradient(0deg,
                    transparent 0%,
                    transparent 8%,
                    rgba(0, 0, 0, 0.3) 8%,
                    rgba(0, 0, 0, 0.3) 9%,
                    transparent 9%,
                    transparent 17%,
                    rgba(0, 0, 0, 0.3) 17%,
                    rgba(0, 0, 0, 0.3) 18%);
            z-index: 1;
        }

        .drum.rotating {
            animation: drumRotate 2s linear infinite !important;
        }

        /* 원통이 회전할 때 세탁물 컨테이너는 고정 (원통 내부에서 도는 효과) */
        .drum.rotating .laundry {
            animation: counterRotate 2s linear infinite;
        }

        .drum.stopping .laundry {
            animation: counterSlowStop 3s ease-out forwards;
        }

        @keyframes counterRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(-360deg);
            }
        }

        @keyframes counterSlowStop {
            0% {
                transform: rotate(0deg);
                animation-timing-function: linear;
            }

            30% {
                transform: rotate(-108deg);
            }

            60% {
                transform: rotate(-180deg);
                animation-timing-function: ease-out;
            }

            100% {
                transform: rotate(-216deg);
            }
        }

        .drum.stopping {
            animation: drumSlowStop 3s ease-out forwards !important;
        }

        @keyframes drumRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes drumSlowStop {
            0% {
                transform: rotate(0deg);
                animation-timing-function: linear;
            }

            30% {
                transform: rotate(108deg);
            }

            60% {
                transform: rotate(180deg);
                animation-timing-function: ease-out;
            }

            100% {
                transform: rotate(216deg);
            }
        }

        /* 세탁통 구멍 패턴 - 회전이 잘 보이도록 */
        .drum-holes {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            z-index: 4;
        }

        .drum-hole {
            position: absolute;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            box-shadow:
                inset 0 0 8px rgba(0, 0, 0, 1),
                0 0 3px rgba(0, 0, 0, 0.5);
        }

        /* 원형으로 더 많은 구멍 배치 */
        .drum-hole:nth-child(1) {
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
        }

        .drum-hole:nth-child(2) {
            top: 12%;
            left: 70%;
        }

        .drum-hole:nth-child(3) {
            top: 20%;
            left: 82%;
        }

        .drum-hole:nth-child(4) {
            top: 30%;
            left: 90%;
        }

        .drum-hole:nth-child(5) {
            top: 40%;
            left: 94%;
        }

        .drum-hole:nth-child(6) {
            top: 50%;
            left: 96%;
        }

        .drum-hole:nth-child(7) {
            top: 60%;
            left: 94%;
        }

        .drum-hole:nth-child(8) {
            top: 70%;
            left: 90%;
        }

        .drum-hole:nth-child(9) {
            top: 80%;
            left: 82%;
        }

        .drum-hole:nth-child(10) {
            top: 88%;
            left: 70%;
        }

        .drum-hole:nth-child(11) {
            top: 95%;
            left: 50%;
            transform: translateX(-50%);
        }

        .drum-hole:nth-child(12) {
            top: 88%;
            left: 30%;
        }

        .drum-hole:nth-child(13) {
            top: 80%;
            left: 18%;
        }

        .drum-hole:nth-child(14) {
            top: 70%;
            left: 10%;
        }

        .drum-hole:nth-child(15) {
            top: 60%;
            left: 6%;
        }

        .drum-hole:nth-child(16) {
            top: 50%;
            left: 4%;
        }

        .drum-hole:nth-child(17) {
            top: 40%;
            left: 6%;
        }

        .drum-hole:nth-child(18) {
            top: 30%;
            left: 10%;
        }

        .drum-hole:nth-child(19) {
            top: 20%;
            left: 18%;
        }

        .drum-hole:nth-child(20) {
            top: 12%;
            left: 30%;
        }

        .drum-center {
            display: none;
        }

        /* 세탁물 - laundry.png 이미지 사용 */
        .laundry {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            overflow: hidden;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .laundry-image {
            width: 390px;
            height: 390px;
            background-image: url('laundry.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            z-index: 5;
        }

        /* 통이 회전할 때 세탁물은 원통 내부에서 도는 것처럼 보이게 */
        /* .laundry 컨테이너가 반대 방향으로 회전하므로, .laundry-image는 추가 회전 없이도 원통 내부에서 도는 것처럼 보임 */
        .drum.rotating .laundry-image {
            animation: laundryRotate 1.5s linear infinite;
        }

        .drum.stopping .laundry-image {
            animation: laundrySlowStop 3s ease-out forwards;
        }

        @keyframes laundryRotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes laundrySlowStop {
            0% {
                transform: rotate(0deg);
                animation-timing-function: linear;
            }

            30% {
                transform: rotate(108deg);
            }

            60% {
                transform: rotate(180deg);
                animation-timing-function: ease-out;
            }

            100% {
                transform: rotate(216deg);
            }
        }

        /* 물 효과 */
        .water-effect {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background:
                radial-gradient(circle at 50% 50%, rgba(120, 180, 255, 0.2) 0%, transparent 65%);
            z-index: 6;
            pointer-events: none;
        }

        .play-button {
            font-size: 0;
        }

        .play-button::before {
            content: '▶';
            font-size: 24px;
            display: block;
            line-height: 1;
        }

        .play-button.playing::before {
            content: '⏸';
        }
    </style>
</head>

<body>
    <div class="washing-machine">
        <div class="control-panel">
            <div class="power-button">⏻</div>

            <div class="main-display" id="mainDisplay">
                <div class="status-dots">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
                <div class="main-status" id="mainStatus">표준</div>
                <div class="sub-status" id="subStatus">
                    온도 40°C 헹굼 2회<br>
                    탈수 강
                </div>
            </div>

            <div class="play-button" id="playButton"></div>

            <div class="settings-panel">
                <div class="setting-item">
                    <div class="setting-dots">
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot active"></div>
                        <div class=" setting-dot"></div>
                        <div class="setting-dot"></div>
                    </div>
                    <div class="setting-label">온도</div>
                </div>
                <div class="setting-item">
                    <div class="setting-dots">
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot active"></div>
                        <div class="setting-dot"></div>
                    </div>
                    <div class="setting-label">헹굼</div>
                </div>
                <div class="setting-item">
                    <div class="setting-dots">
                        <div class="setting-dot active"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                        <div class="setting-dot"></div>
                    </div>
                    <div class="setting-label">탈수</div>
                </div>
            </div>
        </div>

        <div class="drum-container">
            <div class="door-frame">
                <div class="door-glass"></div>
                <div class="door-handle"></div>
            </div>
            <div class="drum" id="drum">
                <div class="drum-holes">
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                    <div class="drum-hole"></div>
                </div>
                <div class="laundry">
                    <div class="laundry-image"></div>
                </div>
                <div class="water-effect"></div>
                <div class="drum-center"></div>
            </div>
        </div>
    </div>

    <!-- BGM 오디오 요소 -->
    <audio id="bgmAudio" preload="auto">
        <source src="세탁기bgm.mp4" type="audio/mpeg">
    </audio>

    <script>
        const playButton = document.getElementById('playButton');
        const drum = document.getElementById('drum');
        const mainStatus = document.getElementById('mainStatus');
        const subStatus = document.getElementById('subStatus');
        const statusDots = document.querySelectorAll('.status-dots .dot');
        const bgmAudio = document.getElementById('bgmAudio');

        // 오디오 볼륨 설정 (0.0 ~ 1.0)
        if (bgmAudio) {
            bgmAudio.volume = 0.7; // 70% 볼륨
            // 오디오 로드 에러 처리
            bgmAudio.addEventListener('error', function (e) {
                console.error('[BGM] 오디오 로드 에러:', bgmAudio.error);
                console.error('[BGM] 오디오 소스:', bgmAudio.src);
            });
        }

        // 오디오 컨텍스트 활성화 플래그
        let audioContextActivated = false;

        // 사용자 상호작용 시 오디오 컨텍스트 활성화
        function activateAudioContext() {
            if (!audioContextActivated && bgmAudio) {
                // 오디오 컨텍스트를 활성화하기 위해 조용히 재생 시도
                const playPromise = bgmAudio.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            // 재생 성공 시 즉시 일시정지 (실제 재생은 나중에)
                            bgmAudio.pause();
                            bgmAudio.currentTime = 0;
                            audioContextActivated = true;
                            console.log('[BGM] 오디오 컨텍스트 활성화 완료');
                        })
                        .catch(() => {
                            // 실패해도 무시 (나중에 재시도) - 조용히 처리
                        });
                }
            }
        }

        // 페이지 클릭/터치 시 오디오 컨텍스트 활성화
        document.addEventListener('click', activateAudioContext, { once: true });
        document.addEventListener('touchstart', activateAudioContext, { once: true });

        // 재생 버튼 클릭 시에도 활성화
        if (playButton) {
            playButton.addEventListener('click', activateAudioContext);
        }

        let isRunning = false;
        let timeoutId = null;

        function handlePlayButton() {
            console.log('[세탁기] handlePlayButton() 호출됨, isRunning:', isRunning);

            if (isRunning) {
                // 일시정지
                clearTimeout(timeoutId);
                drum.classList.remove('rotating');
                if (bgmAudio) {
                    bgmAudio.pause();
                }
                isRunning = false;
                playButton.classList.remove('playing');
                return;
            }

            console.log('[세탁기] 세탁기 시작 처리 시작');
            isRunning = true;
            playButton.classList.add('playing');
            // ⏯️ 이모지는 자동으로 멈춤 상태를 보여줌

            // BGM 재생 시작 (끝까지 재생)
            // 버튼 클릭은 사용자 상호작용으로 간주되므로 바로 재생 시도
            // 오디오 컨텍스트가 활성화되어 있으면 재생, 아니면 조용히 실패 (로봇청소기와 동일)
            if (bgmAudio && audioContextActivated) {
                // 오디오가 로드되었는지 확인
                if (bgmAudio.readyState >= 2) { // HAVE_CURRENT_DATA 이상
                    bgmAudio.currentTime = 0;
                    const playPromise = bgmAudio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                console.log('[BGM] 재생 시작 성공');
                            })
                            .catch(error => {
                                console.error('[BGM] 재생 실패:', error.name, error.message);
                            });
                    }
                } else {
                    // 오디오가 아직 로드되지 않았으면 로드 대기
                    bgmAudio.addEventListener('canplaythrough', function onCanPlay() {
                        bgmAudio.removeEventListener('canplaythrough', onCanPlay);
                        bgmAudio.currentTime = 0;
                        bgmAudio.play()
                            .then(() => {
                                console.log('[BGM] 재생 시작 성공 (로드 후)');
                            })
                            .catch(error => {
                                console.error('[BGM] 재생 실패 (로드 후):', error.name, error.message);
                            });
                    }, { once: true });
                    // 로드 강제 시작
                    bgmAudio.load();
                }
            }

            // 세탁통 회전 시작
            console.log('[세탁기] 세탁통 회전 시작');
            drum.classList.add('rotating');

            // 안내판 변경: 세척 중
            mainStatus.textContent = '세탁 중';
            subStatus.innerHTML = '온도 40°C 헹굼 2회<br>탈수 강';

            // 상태 점들 활성화 (순차적으로)
            statusDots.forEach((dot, index) => {
                setTimeout(() => {
                    dot.classList.add('active');

                    // 마지막 dot이 채워지면 세탁 완료
                    if (index === statusDots.length - 1) {
                        setTimeout(() => {
                            // 세탁통 회전을 점진적으로 멈춤
                            drum.classList.remove('rotating');
                            drum.classList.add('stopping');

                            // 회전이 완전히 멈춘 후 완료 처리
                            setTimeout(() => {
                                drum.classList.remove('stopping');

                                // 안내판 변경: 세척 완료
                                mainStatus.textContent = '세탁 완료';
                                subStatus.innerHTML = '';

                                // 상태 점들 비활성화
                                statusDots.forEach(dot => {
                                    dot.classList.remove('active');
                                });

                                // 상태 초기화
                                isRunning = false;
                                playButton.classList.remove('playing');

                                // BGM은 끝까지 재생되도록 유지 (자동 정지하지 않음)
                            }, 3000);
                        }, 800);
                    }
                }, index * 400);
            });
        }

        // 페이지 전환 시에도 BGM이 계속 재생되도록 유지
        document.addEventListener('visibilitychange', function () {
            if (!document.hidden && !bgmAudio.paused) {
                // 페이지가 다시 보일 때 재생 중이었다면 계속 재생
                bgmAudio.play().catch(error => {
                    console.error('BGM 재생 실패:', error);
                });
            }
        });

        playButton.addEventListener('click', function () {
            // 클릭 이벤트는 사용자 상호작용으로 간주되므로 오디오 컨텍스트 활성화
            activateAudioContext();

            // handlePlayButton() 로직을 여기에 직접 구현 (로봇청소기와 동일)
            if (isRunning) {
                // 일시정지
                clearTimeout(timeoutId);
                drum.classList.remove('rotating');
                if (bgmAudio) {
                    bgmAudio.pause();
                }
                isRunning = false;
                playButton.classList.remove('playing');
                return;
            }

            isRunning = true;
            playButton.classList.add('playing');

            // BGM 재생 시작 (끝까지 재생)
            // 버튼 클릭은 사용자 상호작용으로 간주되므로 바로 재생 시도
            // 오디오 컨텍스트가 활성화되어 있으면 재생, 아니면 조용히 실패 (로봇청소기와 동일)
            if (bgmAudio && audioContextActivated) {
                // 오디오가 로드되었는지 확인
                if (bgmAudio.readyState >= 2) { // HAVE_CURRENT_DATA 이상
                    bgmAudio.currentTime = 0;
                    const playPromise = bgmAudio.play();
                    if (playPromise !== undefined) {
                        playPromise
                            .then(() => {
                                console.log('[BGM] 재생 시작 성공');
                            })
                            .catch(error => {
                                console.error('[BGM] 재생 실패:', error.name, error.message);
                            });
                    }
                } else {
                    // 오디오가 아직 로드되지 않았으면 로드 대기
                    bgmAudio.addEventListener('canplaythrough', function onCanPlay() {
                        bgmAudio.removeEventListener('canplaythrough', onCanPlay);
                        bgmAudio.currentTime = 0;
                        bgmAudio.play()
                            .then(() => {
                                console.log('[BGM] 재생 시작 성공 (로드 후)');
                            })
                            .catch(error => {
                                console.error('[BGM] 재생 실패 (로드 후):', error.name, error.message);
                            });
                    }, { once: true });
                    // 로드 강제 시작
                    bgmAudio.load();
                }
            }

            // 세탁통 회전 시작
            drum.classList.add('rotating');

            // 안내판 변경: 세척 중
            mainStatus.textContent = '세탁 중';
            subStatus.innerHTML = '온도 40°C 헹굼 2회<br>탈수 강';

            // 상태 점들 활성화 (순차적으로)
            statusDots.forEach((dot, index) => {
                setTimeout(() => {
                    dot.classList.add('active');

                    // 마지막 dot이 채워지면 세탁 완료
                    if (index === statusDots.length - 1) {
                        setTimeout(() => {
                            // 세탁통 회전을 점진적으로 멈춤
                            drum.classList.remove('rotating');
                            drum.classList.add('stopping');

                            // 회전이 완전히 멈춘 후 완료 처리
                            setTimeout(() => {
                                drum.classList.remove('stopping');

                                // 안내판 변경: 세척 완료
                                mainStatus.textContent = '세탁 완료';
                                subStatus.innerHTML = '';

                                // 상태 점들 비활성화
                                statusDots.forEach(dot => {
                                    dot.classList.remove('active');
                                });

                                // 상태 초기화
                                isRunning = false;
                                playButton.classList.remove('playing');

                                // BGM은 끝까지 재생되도록 유지 (자동 정지하지 않음)
                            }, 3000);
                        }, 800);
                    }
                }, index * 400);
            });
        });

        // 엔터 키로 작동 버튼 클릭
        document.addEventListener('keydown', function (event) {
            if (event.key === 'Enter' || event.keyCode === 13) {
                event.preventDefault();
                handlePlayButton();
            }
        });

        // 원격 시작 명령 폴링 (Flutter 앱에서 시작 명령을 보내면 자동으로 시작)
        // 백엔드 서버 URL 설정
        // 로컬 개발: 'http://localhost:8088/api'
        // 다른 기기에서 접근: 'http://[PC의 IP 주소]:8088/api' (예: 'http://192.168.0.47:8088/api')
        // PC의 IP 주소 확인 방법:
        //   - Windows: ipconfig 명령어 실행 후 "IPv4 주소" 확인
        //   - Mac/Linux: ifconfig 또는 ip addr 명령어 실행
        // URL 파라미터에서 IP 주소 가져오기 (예: ?ip=192.168.0.47)
        const urlParams = new URLSearchParams(window.location.search);
        const serverIP = urlParams.get('ip') || '192.168.0.47'; // 기본값: 192.168.0.47
        const API_BASE_URL = `http://${serverIP}:8088/api`;

        console.log('[세탁기] 서버 IP:', serverIP);
        console.log('[세탁기] API_BASE_URL:', API_BASE_URL);

        // 폴링 간격 (밀리초)
        const POLLING_INTERVAL = 1000; // 1초마다 확인

        function checkRemoteStartCommand() {
            fetch(`${API_BASE_URL}/device/check-washing-machine-command`)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP error! status: ${response.status}`);
                    }
                    return response.json();
                })
                .then(data => {
                    console.log('[폴링] 응답 데이터:', data);
                    console.log('[폴링] should_start:', data.should_start);
                    console.log('[폴링] isRunning:', isRunning);

                    if (data.should_start && !isRunning) {
                        console.log('✅ 원격 시작 명령 수신:', data);
                        console.log('✅ playButton.click() 호출 시작');
                        // 버튼 클릭 이벤트를 트리거하여 사용자 상호작용으로 간주되도록 함 (로봇청소기와 동일)
                        playButton.click();
                        console.log('✅ playButton.click() 호출 완료');
                    } else if (data.should_start && isRunning) {
                        console.log('⚠️ 시작 명령 수신했지만 이미 실행 중입니다.');
                    } else {
                        // should_start가 false인 경우는 로그를 출력하지 않음 (너무 많아짐)
                        // console.log('[폴링] 시작 명령 없음');
                    }
                })
                .catch(error => {
                    // 첫 번째 에러만 로그 출력 (연결 실패 시)
                    if (!checkRemoteStartCommand.errorLogged) {
                        console.error('❌ 원격 시작 명령 확인 실패:', error);
                        console.error('API_BASE_URL:', API_BASE_URL);
                        checkRemoteStartCommand.errorLogged = true;
                    }
                });
        }

        // 에러 로그 플래그 초기화
        checkRemoteStartCommand.errorLogged = false;

        // 페이지 로드 시 연결 테스트 및 폴링 시작
        (async function () {
            // 연결 테스트
            try {
                const testResponse = await fetch(`${API_BASE_URL}/device/test`);
                const testData = await testResponse.json();
                console.log('✅ 서버 연결 성공:', testData);
            } catch (error) {
                console.error('❌ 서버 연결 실패:', error);
                console.error('API_BASE_URL:', API_BASE_URL);
                console.error(`서버가 실행 중인지 확인하세요: http://${serverIP}:8088`);
                console.error('URL 파라미터로 IP를 지정할 수 있습니다: ?ip=192.168.0.XX');
            }

            // 폴링 시작
            setInterval(checkRemoteStartCommand, POLLING_INTERVAL);
        })();
    </script>
</body>
